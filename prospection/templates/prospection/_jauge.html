<svg class="gauge" width="58" height="58" viewBox="0 0 58 58" role="img" aria-label="Score {{ score }} sur 100"><circle cx="29" cy="29" r="23" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="29" cy="29" r="23" fill="none" stroke="{% if palier == 'A' %}var(--ok){% elif palier == 'B' %}var(--warn){% else %}var(--muted){% endif %}" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{ dash }}" transform="rotate(-90 29 29)"/><text x="29" y="34" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="600" fill="var(--fg)">{{ score }}</text></svg>
