<title>Agent de prospection FORMA'ST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout : barre latérale de navigation (barre horizontale sur mobile) + zone de travail ; palette reprise de Veille AO (rouge FORMA'ST, neutres chauds) */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#faf9f7; --fg:#1f2328; --muted:#626a73; --line:#e1ded8;
  --accent:#b3261e; --accent-fg:#ffffff; --accent-soft:#f8e7e5;
  --ok:#1f7a3a; --ok-soft:#e5f2e8; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#f8e7e5; --info:#0b5cad; --info-soft:#e4eef9;
  --font-display:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151618; --surface:#1d1e21; --surface-2:#242529; --fg:#ebeae6; --muted:#a2a6ab; --line:#33353a;
  --accent:#e5685d; --accent-fg:#1a0b09; --accent-soft:#3a2220;
  --ok:#62c27e; --ok-soft:#1c3324; --warn:#e3a646; --warn-soft:#3a2d17; --bad:#ef6d63; --bad-soft:#3d2120; --info:#74aef0; --info-soft:#1c2c40;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#151618; --surface:#1d1e21; --surface-2:#242529; --fg:#ebeae6; --muted:#a2a6ab; --line:#33353a;
  --accent:#e5685d; --accent-fg:#1a0b09; --accent-soft:#3a2220;
  --ok:#62c27e; --ok-soft:#1c3324; --warn:#e3a646; --warn-soft:#3a2d17; --bad:#ef6d63; --bad-soft:#3d2120; --info:#74aef0; --info-soft:#1c2c40;
  color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;flex-direction:column;padding:4px 10px 14px}
.brand b{font-family:var(--font-display);color:var(--accent);font-size:17px}
.brand span{color:var(--muted);font-size:12px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
.badge{font-size:11px;min-width:20px;text-align:center;padding:0 6px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.nav a.on .badge{border-color:transparent;background:var(--accent);color:var(--accent-fg)}
.main{min-width:0;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.top .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sub{color:var(--muted);font-size:13px}
.demo{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2a{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.g2b{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--font-display);font-size:24px;font-weight:600}
.kpi .l{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--surface);color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea{width:100%;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tier{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-weight:700;font-size:12px;font-family:var(--font-display)}
.tier.A{background:var(--ok);color:var(--surface)} .tier.B{background:var(--warn);color:var(--surface)} .tier.C{background:var(--line);color:var(--muted)}
.score{display:flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.info i{background:var(--info)}
.muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel .fr{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}
.funnel .fb{height:18px;border-radius:4px;background:var(--accent);opacity:.85}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.out{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13.5px;min-height:180px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .j{font-family:var(--font-display);font-weight:600;color:var(--muted)}
.ty{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:4px}
.ty.email{background:var(--info-soft);color:var(--info)} .ty.linkedin{background:var(--ok-soft);color:var(--ok)} .ty.appel{background:var(--warn-soft);color:var(--warn)} .ty.tache{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--surface);border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(16px)}
.rule{font-size:13px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 8px}
.rule b{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto;padding:4px}
.msg{max-width:88%;padding:9px 12px;border-radius:10px;font-size:13.5px;min-width:0}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;max-width:360px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--radius);padding:10px 12px}
.mail{white-space:pre-wrap;font-size:13.5px;border-left:3px solid var(--line);padding-left:12px}
.crm{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.crm .h{background:var(--surface-2);padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.widget{border:1px solid var(--accent);border-radius:var(--radius);padding:12px;background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (max-width:980px){ .g2,.g2e,.g2a,.g2b,.g3{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .nav .grp,.brand span{display:none}
  .brand{padding:6px 8px 6px 0;flex:none}
  .nav a{flex:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .hide-m{display:none}
}
/* --- v4 : barre supérieure, icônes, palette, journée, colonnes --- */
.ic{width:17px;height:17px;flex:none}
.nav a .lbl{display:flex;align-items:center;gap:10px;min-width:0}
.nav a .ic{opacity:.75} .nav a.on .ic{opacity:1}
.nav .foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;text-align:left;min-width:0}
.search span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:11px var(--font-body);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none}
.iconbtn .dotc{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.pal-back{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:calc(12vh + env(safe-area-inset-top,0px)) 16px 16px}
.pal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px;background:var(--surface);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.pal li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer}
.pal li.on{background:var(--accent-soft);color:var(--accent)}
.pal li .k{margin-left:auto;font-size:11px;color:var(--muted)}
.pal .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h1{font-size:26px}
.night{display:flex;flex-direction:column;gap:6px}
.night .li{padding:6px 0}
.nba{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.nba:last-child{border-bottom:0}
.nba .ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.nba .ico.hot{background:var(--accent-soft);color:var(--accent)}
.nba .why{font-size:12.5px;color:var(--muted);margin-top:2px}
.nba .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prog{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-ctl button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button.on{background:var(--accent);color:var(--accent-fg)}
.seg-ctl button[disabled]{cursor:not-allowed;opacity:.45}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--fg)}
.views button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:260px;display:flex;flex-direction:column;gap:8px}
.kcol.over{border-color:var(--accent);background:var(--accent-soft)}
.kcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;padding:2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:4px}
.kc:hover{border-color:var(--muted)}
.kc.drag{opacity:.4}
.gauge{flex:none}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.qc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px;margin-top:8px;font-size:12.5px}
.qc span{display:flex;gap:6px;align-items:flex-start}
.qc .y{color:var(--ok)} .qc .n{color:var(--warn)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.camp{display:flex;flex-direction:column;gap:6px}
.camp .m{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lvl td:first-child{min-width:220px}
.flow{display:flex;align-items:stretch;gap:0;margin-top:8px;font-size:12.5px}
.flow>div{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface-2)}
.flow>div b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.flow>div.q{border-left:3px solid var(--info)} .flow>div.si{border-left:3px solid var(--warn)} .flow>div.al{border-left:3px solid var(--ok)}
.flow>i{flex:none;width:18px;align-self:center;text-align:center;color:var(--muted);font-style:normal}
.aic{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 4px 2px 10px;border-radius:20px;background:var(--info-soft);color:var(--info)}
.aic button{border:0;background:none;color:inherit;cursor:pointer;padding:0 4px;font-size:13px}
th.ai{color:var(--info)}
.dv td,.dv th{padding:6px 8px}
.dv input[type=number]{width:62px;padding:3px 6px}
.tot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:13px;margin-top:8px}
.tot b{text-align:right}
.fc{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.fc:last-child{border-bottom:0}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.pb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="pal"></div>

<script>
/* ============ Données fictives ============ */
const TODAY = new Date(2026,10,18);
const DAY = 864e5;

/* ============ Calculs ============ */
const W = ()=>S.weights;
const prioDeps = ()=>W().prio.split(/[ ,;]+/).filter(Boolean);
function fitScore(p){
  let s = (SEGMENTS[p.seg]||{w:5}).w;
  const e=p.eff; s += e>=50&&e<=1000?30: e>1000?22: e>=20?18:5;
  s += p.sites>10?15: p.sites>1?10:0;
  s += prioDeps().includes(p.dep)?15:5;
  if(p.icpe) s+=10; if(p.erp) s+=5;
  return Math.min(100,s);
}
function intScore(p){
  let s=0; for(const g of p.signaux){const d=SIGNAUX[g.t]; if(!d) continue; s += d.w*Math.pow(.5,g.d/d.hl);}
  return Math.min(100,Math.round(s*1.6));
}
function accScore(p){
  let s=0; const dec=p.contacts.find(c=>c.role==='decideur');
  if(dec) s+=40; else if(p.contacts.some(c=>c.role==='prescripteur')) s+=20;
  if(p.contacts.some(c=>c.es==='verifie' && c.role!=='standard')) s+=30; else if(p.contacts.some(c=>c.es==='probable')) s+=15;
  if(p.contacts.some(c=>c.tel)) s+=15;
  if(p.client) s+=15;
  return Math.min(100,s);
}
function score(p){
  const w=W(), f=fitScore(p), i=intScore(p), a=accScore(p);
  const t=Math.round((w.fit*f+w.int*i+w.acc*a)/Math.max(1,(+w.fit + +w.int + +w.acc)));
  return {f,i,a,t,tier: t>=w.seuilA?'A': t>=w.seuilB?'B':'C'};
}
function besoin(p){
  const sst=Math.ceil(p.eff*W().tauxSST/100), sSess=Math.ceil(sst/10);
  const gpN=Math.round(p.eff*((SEGMENTS[p.seg]||{gp:0}).gp)), gSess=Math.ceil(gpN/10);
  const exo=2*Math.max(1,Math.min(p.sites,20));
  const an1=sSess*PRIX.sst+gSess*PRIX.gp+exo*PRIX.incendie;
  const rec=Math.ceil(sSess/2)*PRIX.sst*.55+exo*PRIX.incendie;
  return {sst,sSess,gpN,gSess,exo,an1,rec,opcoAide:p.eff<50};
}

/* ---- Prospects ---- */
function filtered(){
  const f=ui.filt, q=f.q.toLowerCase();
  return S.prospects.map(p=>({p,s:score(p)})).filter(({p,s})=>
    (!q || (p.nom+' '+p.ville+' '+p.naf+' '+p.contacts.map(c=>c.n).join(' ')).toLowerCase().includes(q)) &&
    (!f.tier || s.tier===f.tier) && (!f.seg || p.seg===f.seg) && (!f.dep || p.dep===f.dep) && (!f.statut || p.statut===f.statut) && (!f.sig || p.signaux.length) && (!f.nc || !mainContact(p) || mainContact(p).role==='standard')
  ).sort((a,b)=>b.s.t-a.s.t);
}

/* ---- Qualité du message ---- */
const MOTS_SIG={site:/établissement|ouvr|bâtiment/i,qse:/HSE|QSE|prévention/i,recrut:/recrut|postes|nouveaux salariés/i,dirigeant:/fonction/i,marche:/marché/i,ao:/consultation/i,mac:/MAC|recyclage/i,presse:/annonce|évolution/i,web:/guide/i,ouvert:/./};
function qualite(txt,canal,p){
  if(canal==='appel') return null;
  const c=[]; const corps=txt.split('\n—\n')[0];
  if(canal==='linkedin'){
    c.push([txt.length<=300,`${txt.length} / 300 caractères`]);
    c.push([!/https?:\/\//.test(txt),'Pas de lien dans une invitation']);
    c.push([/Bonjour \S/.test(txt),'Salutation personnalisée']);
    c.push([!/gratuit|promo|urgent/i.test(txt),'Pas de ton promotionnel']);
  } else {
    const mots=corps.split(/\s+/).filter(Boolean).length, q=(corps.match(/\?/g)||[]).length, g=topSig(p);
    c.push([mots>=60&&mots<=170,`${mots} mots (idéal : 60 à 170)`]);
    c.push([corps.includes(p.nom)||p.contacts.some(x=>corps.includes(x.n)),"Personnalisé (entreprise ou contact cité)"]);
    c.push([!g||MOTS_SIG[g.t].test(corps),g?`Accroche sur le signal « ${SIGNAUX[g.t].l.toLowerCase()} »`:'Accroche sur le secteur']);
    c.push([q===1,q===1?'Une seule question, claire':`${q} questions (en garder une)`]);
    c.push([!/gratuit|urgent|promo|exceptionnel|garanti|!!/i.test(corps),'Pas de mots qui déclenchent les filtres anti-spam']);
    c.push([/opposition/i.test(txt),"Lien d'opposition présent"]);
    { const m=txt.match(/\[(?!lien)[^\]]+\]/g)||[]; c.push([!m.length, m.length?`À compléter : ${[...new Set(m)].slice(0,3).join(', ')}`:'Aucun champ à compléter']); }
  }
  const ok=c.filter(x=>x[0]).length; return {pct:Math.round(ok/c.length*100),c};
}
function majQualite(){
  const t=$('#g-out'), box=$('#qc'), sc=$('#qc-score'); if(!t||!box) return;
  const q=qualite(t.value,ui.canal,byId(ui.pid));
  if(!q){ box.innerHTML='<span class="muted">Le script d\'appel n\'est pas contrôlé : il sert de guide.</span>'; sc.innerHTML=''; return; }
  sc.innerHTML=`<span class="chip ${q.pct>=85?'ok':q.pct>=60?'warn':'bad'}">${q.pct} / 100</span>`;
  box.innerHTML=q.c.map(([ok,l])=>`<span><b class="${ok?'y':'n'}">${ok?'✓':'!'}</b>${esc(l)}</span>`).join('');
}

function answer(q){
  const l=q.toLowerCase();

  const named=S.prospects.find(p=>l.includes(p.nom.toLowerCase().slice(0,10)));
  if(/pourquoi/.test(l) && named) return {h:`<b>${esc(named.nom)}</b><br>${esc(explain(named))}<br><span class="small">Score ${score(named).t} = adéquation ${score(named).f} × ${W().fit} + intention ${score(named).i} × ${W().int} + accessibilité ${score(named).a} × ${W().acc}.</span>`};
  if(/(pr[ée]pare|rendez-vous|rdv)/.test(l) && named){ const b=besoin(named); return {h:`<b>Fiche de préparation · ${esc(named.nom)}</b><div class="out" style="min-height:0;margin-top:6px">${esc(brief(named))}\n\nQuestions à poser :\n· Combien de SST aujourd'hui et date de leur dernière formation ?\n· Dernier exercice d'évacuation ? Guides et serre-files désignés ?\n· Calendrier des arrivées et budget formation 2027\n\nOffre à pousser : ${b.sSess} session(s) SST + ${b.gSess} gestes et postures + ${b.exo} exercice(s) incendie, soit ${eur(b.an1)} (tarifs d'exemple)</div>`}; }
  if(/recycl|mac/.test(l)){ const r=S.prospects.filter(p=>p.signaux.some(g=>g.t==='mac')); return {h:`${r.length} client${r.length>1?'s':''} à recycler :<br>${r.map(p=>`· <a href="#" data-act="open" data-id="${p.id}">${esc(p.nom)}</a> : ${esc(p.signaux.find(g=>g.t==='mac').txt)}`).join('<br>')}`, ids:r.map(p=>p.id), seq:3}; }
  let res=S.prospects.filter(p=>!['Opposé','Écarté'].includes(p.statut));
  const crit=[];
  const deps=(l.match(/\b(0[1-9]|[1-8]\d|9[0-5]|2a|2b)\b/g)||[]); if(deps.length){res=res.filter(p=>deps.includes(p.dep)); crit.push('départements '+deps.join(', '));}
  const m=l.match(/(plus de|\+|>|au moins)\s*(\d+)/); if(m){res=res.filter(p=>p.eff>=+m[2]); crit.push('effectif ≥ '+m[2]);}
  if(segK){res=res.filter(p=>p.seg===segK); crit.push(SEGMENTS[segK].l.toLowerCase());}
  if(/icpe/.test(l)){res=res.filter(p=>p.icpe); crit.push('ICPE');}
  if(/sans contact|contact identifi/.test(l)){res=res.filter(p=>!mainContact(p)||mainContact(p).role==='standard'); crit.push('sans décideur identifié');}
  if(/signal/.test(l)){res=res.filter(p=>p.signaux.length); crit.push('avec signal');}
  const t=l.match(/\b(?:palier|tier)?\s*\b([abc])\b(?=\s|$)/); if(/palier|prospects a\b|^a\b/.test(l)&&t){res=res.filter(p=>score(p).tier===t[1].toUpperCase()); crit.push('palier '+t[1].toUpperCase());}
  if(!crit.length) return {t:"Je n'ai pas reconnu de critère. Essayez avec un secteur (logistique, santé, industrie…), un département (95), un effectif (« plus de 100 salariés »), « ICPE », « avec signal » ou « sans contact »."};
  res.sort((a,b)=>score(b).t-score(a).t);
  return {h:`<b>${res.length}</b> prospect${res.length>1?'s':''} · ${esc(crit.join(' · '))}${res.length?`<div class="tw" style="margin-top:6px"><table><thead><tr><th>Prospect</th><th>Score</th><th>Signal</th></tr></thead><tbody>${res.map(p=>`<tr class="click" data-act="open" data-id="${p.id}"><td>${esc(p.nom)}<div class="small muted">${esc(p.ville)} · ${p.eff} sal.</div></td><td>${tierChip(score(p))} ${score(p).t}</td><td class="small">${topSig(p)?SIGNAUX[topSig(p).t].l:'—'}</td></tr>`).join('')}</tbody></table></div>`:''}${res.length?'<div class="small" style="margin-top:6px">Je peux les inscrire en séquence « Ouverture de site » : utilisez le bouton de confirmation ci-dessous.</div>':''}`, ids:res.map(p=>p.id), seq:1};
}

function luhn(n){ n=n.replace(/\s/g,''); if(!/^\d{9}$|^\d{14}$/.test(n)) return false; let s=0; for(let i=0;i<n.length;i++){ let d=+n[n.length-1-i]; if(i%2){d*=2; if(d>9)d-=9;} s+=d;} return s%10===0 || n.startsWith('356000000'); }
function parseCSV(txt){
  txt=txt.replace(/^﻿/,''); const first=txt.split(/\r?\n/)[0]; const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'&&txt[i+1]==='"'){cur+='"';i++;} else if(ch==='"') q=false; else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(c=>c.trim())) rows.push(row); row=[]; } else cur+=ch; }
  row.push(cur); if(row.some(c=>c.trim())) rows.push(row);
  return {sep, head:rows[0]||[], data:rows.slice(1)};
}
const normName = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\b(sas|sarl|sa|sasu|eurl|et cie|& cie)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function analyse(){
  const im=ui.imp; const get=(r,f)=>{const i=im.map.indexOf(f); return i>=0?(r[i]||'').trim():'';};
  const seen=new Set();
  im.rows=im.data.map(r=>{
    const o={nom:get(r,'nom'),siret:get(r,'siret').replace(/\s/g,''),ville:get(r,'ville'),cp:get(r,'cp'),naf:get(r,'naf'),eff:+get(r,'eff')||0,contact:get(r,'contact'),fonction:get(r,'fonction'),email:get(r,'email').toLowerCase(),tel:get(r,'tel')};
    let st='Nouveau', cls='ok', note='';
    const dup=S.prospects.find(p=>(o.siret && p.siren && o.siret.slice(0,9)===p.siren.replace(/\s/g,'')) || normName(p.nom)===normName(o.nom));
    if(!o.nom){st='Rejeté';cls='bad';note='raison sociale vide';}
    else if(dup){st='Doublon';cls='';note='déjà présent : '+dup.nom+' (fusion proposée)';}
    else if(seen.has(normName(o.nom))){st='Doublon';cls='';note='doublon dans le fichier';}
    else if(o.email && S.oppositions.some(x=>x.startsWith('@')?o.email.endsWith(x.slice(1)):x===o.email)){st='Opposé';cls='bad';note='présent sur la liste d\'opposition : contact non importé';}
    else if(o.siret && !luhn(o.siret)){st='À vérifier';cls='warn';note='SIRET invalide : rapprochement SIRENE par nom + commune';}
    else if(/@(gmail|hotmail|yahoo|orange|free|wanadoo|outlook|laposte)\./.test(o.email)){st='À vérifier';cls='warn';note='adresse e-mail personnelle : à remplacer par une adresse professionnelle';}
    else if(!o.contact){st='Nouveau';cls='info';note='sans contact : enrichissement proposé';}
    seen.add(normName(o.nom));
    return {...o,st,cls,note};
  });
}

function loadCSV(txt,name){
  const p=parseCSV(txt);
  const map=p.head.map(h=>{ for(const [k,re] of Object.entries(SYN)) if(re.test(h)) return k; return ''; });

  ui.imp={name,head:p.head,data:p.data,map}; analyse(); render();
}
function nafSeg(naf){ const n=naf.replace('.',''); if(/^(49|52|53)/.test(n))return'logistique'; if(/^(86|87|88)/.test(n))return'sante'; if(/^(10|11|1[2-9]|2\d|3[0-3])/.test(n))return'industrie'; if(/^(47|46)/.test(n))return'commerce'; if(/^84/.test(n))return'collectivite'; if(/^(55|56)/.test(n))return'hotellerie'; if(/^(41|42|43)/.test(n))return'btp'; return 'commerce'; }

    ${a.sim?`<div class="confirm small" style="margin-top:8px">${a.sim}</div>`:''}</div>`).join('')}</div>`;

function simulate(a){
  let ps=[];
  if(/palier A/i.test(a.si)||/palier A/i.test(a.q)) ps=S.prospects.filter(p=>score(p).tier==='A'&&!['Client','Opposé'].includes(p.statut));
  else if(/client/i.test(a.si)) ps=S.prospects.filter(p=>p.client);
  else if(/QSE/i.test(a.q)) ps=S.prospects.filter(p=>p.signaux.some(g=>g.t==='qse'));
  else if(/établissement/i.test(a.q)) ps=S.prospects.filter(p=>p.signaux.some(g=>g.t==='site'));
  else if(/contact/i.test(a.si)) ps=S.prospects.filter(p=>!mainContact(p));
  else if(/pas maintenant/i.test(a.q)) ps=S.prospects.filter(p=>p.statut==='Pas maintenant');
  else ps=S.prospects.filter(p=>p.statut==='En séquence').slice(0,3);
  return ps.length? `Simulation : agirait aujourd'hui sur <b>${ps.length}</b> prospect${ps.length>1?'s':''} : ${ps.slice(0,6).map(p=>esc(p.nom)).join(', ')}${ps.length>6?'…':''}. Aucune modification faite.` : 'Simulation : aucun prospect concerné aujourd\'hui.';
}

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
const now = ()=>fmt(TODAY)+' '+new Date().toTimeString().slice(0,5);
const addHist=(p,txt)=>p.hist.push({d:fmt(TODAY),txt});
const crmLog=(ev,obj)=>S.crmLog.unshift({d:now(),ev,obj,ok:true});
function addTask(t,pid,titre,ech=0){ S.tasks.push({id:++S.nextId,t,pid,titre,ech,fait:false}); }
function inscrire(p,seqId){ const q=S.sequences.find(s=>s.id===+seqId); if(!q||p.statut==='Opposé'||!mainContact(p)) return false; p.statut='En séquence'; q.inscrits++; addHist(p,`Inscrit dans la séquence « ${q.nom} »`); return true; }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;

  switch(a){
    case 'open': ui.canal=el.dataset.canal||'email'; ui.cidx=0; ui.consigne=''; go('fiche',id); break;
    case 'back': go('prospects'); break;
    case 'newp': { const np=P(++S.nextId,'Nouveau prospect','—','95','logistique','52.10B',50,1,{statut:'Nouveau',src:'Saisie manuelle',siren:''}); S.prospects.push(np); save(); toast('Prospect créé. Complétez la fiche ; le rapprochement SIRENE se fera au premier enregistrement.'); go('fiche',np.id); break; }
    case 'enrich': { let n=0; p.contacts.forEach(c=>{ if(c.es==='absent'||c.es==='probable'){ const dom=p.nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]+/g,'').slice(0,14)+'.example'; if(!c.email){const [pr,...nm]=c.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(' '); c.email=pr[0]+'.'+nm.join('')+'@'+dom;} c.es='verifie'; n++; } });
      if(!p.contacts.some(c=>c.role==='decideur')){ p.contacts.push(C('Responsable QSE (à confirmer)','Responsable QHSE','decideur','qse@'+p.nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]+/g,'').slice(0,14)+'.example','probable')); n++; }
      addHist(p,`Enrichissement : ${n} contact${n>1?'s':''} mis à jour (coût 0,12 €)`); ui.gen=null; save(); render(); toast(n?`${n} contact${n>1?'s':''} enrichi${n>1?'s':''}. Coût : 0,12 €.`:'Rien à enrichir.'); break; }
    case 'inscrire': { const sid=$('#fiche-seq').value; if(inscrire(p,sid)){ save(); render(); toast('Inscrit en séquence. Le premier e-mail attend votre validation dans les tâches.'); addTask('email',p.id,`Valider le 1er e-mail pour ${p.nom}`,0); save(); } else toast('Inscription impossible : pas de contact ou opposition.'); break; }
    case 'tache': addTask('appel',p.id,`Appeler ${mainContact(p)?.n||'le standard'} (${p.nom})`,1); addHist(p,'Tâche d\'appel créée pour demain'); save(); render(); toast('Tâche d\'appel créée pour demain.'); break;
    case 'tocrm': p.statut='Transmis au CRM'; addHist(p,'Transmis au CRM : opportunité créée avec le besoin estimé et le brief'); crmLog('prospect.qualifie',p.nom+' → opportunité créée'); save(); render(); toast('Envoyé au CRM : compte, contacts, brief et opportunité.'); break;
    case 'canal': ui.canal=k; ui.gen=null; render(); break;
    case 'regen': ui.consigne=$('#g-cons').value; ui.gen=null; render(); toast(ui.consigne?'Texte régénéré avec la consigne.':'Texte régénéré.'); break;
    case 'copy': { const t=$('#g-out'); const v=t.value; (navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>toast('Copié.')).catch(()=>{t.select();toast('Texte sélectionné : copiez-le avec Ctrl+C.');}); break; }
    case 'valider': { const cs=p.contacts.filter(c=>c.es!=='bloque'), c=cs[ui.cidx]||cs[0]; if(S.oppositions.includes(c.email)){toast('Envoi bloqué : adresse sur la liste d\'opposition.');break;} if(p.statut!=='En séquence') p.statut='En séquence'; addHist(p,`E-mail validé pour ${c.n}, envoi programmé demain 9 h 12`); S.file.unshift({id:++S.nextId,pid:p.id,a:c.email,obj:ui.gen.titre.replace(/^Objet : /,''),quand:'19/11/2026 09:12',boite:p.owner==='S. Diallo'?1:0,st:'Programmé'}); save(); render(); toast(S.mailTest?'Ajouté à la file d\'envoi (mode test : redirigé vers l\'adresse interne).':'Envoi programmé demain à 9 h 12 (plage d\'envoi, plafond respecté).'); break; }

    case 'addc': { const n=$('#nc-n').value.trim(), f=$('#nc-f').value.trim(); if(!n){toast('Indiquez au moins un nom.');break;} p.contacts.push(C(n,f||'—',/dir|drh|g[ée]rant|qse|hse|responsable/i.test(f)?'decideur':'utilisateur','','absent')); addHist(p,'Contact ajouté : '+n); save(); ui.gen=null; render(); toast('Contact ajouté. Lancez l\'enrichissement pour trouver son e-mail.'); break; }
    case 'ecarter': p.statut='Écarté'; addHist(p,'Écarté manuellement'); save(); render(); toast('Prospect écarté.'); break;
    case 'opposer': p.statut='Opposé'; p.contacts.forEach(c=>{ if(c.email&&!S.oppositions.includes(c.email)) S.oppositions.push(c.email); c.es='bloque'; }); addHist(p,'Opposition enregistrée (tous canaux)'); crmLog('opposition.enregistree',p.nom); save(); ui.gen=null; render(); toast('Opposition enregistrée et transmise au CRM.'); break;
    case 'tf': ui.tfilter=k; render(); break;
    case 'session': ui.session=true; render(); break;
    case 'endsession': ui.session=null; render(); break;
    case 'out': { const t=S.tasks.find(x=>x.id===+id), tp=byId(t.pid); t.fait=true; const cr=($('#cr')?.value||'').trim();
      if(k!=='messagerie'){ const dc={sst:$('#pb-sst')?.value??'',exo:$('#pb-exo')?.value||'inconnu',dec:$('#pb-dec')?.value||'',presta:$('#pb-presta')?.value||'',fin:$('#pb-fin')?.value||'',ech:$('#pb-ech')?.value||''}; if(dc.sst!==''||dc.exo!=='inconnu'||dc.dec||dc.presta){ tp.decouverte=dc; addHist(tp,`Découverte : ${dc.sst!==''?dc.sst+' SST formés, ':''}dernier exercice ${dc.exo}${dc.dec?', décideur '+dc.dec:''}${dc.presta?', prestataire '+dc.presta:''}, financement ${dc.fin}, échéance ${dc.ech}`); } }
      if(k==='rdv'){ tp.statut='RDV fixé'; addHist(tp,'Appel : RDV fixé'+(cr?' · '+cr:'')); crmLog('rdv.fixe',tp.nom+' → opportunité et fiche de préparation'); toast('RDV fixé : opportunité créée dans le CRM, fiche de préparation prête.'); }
      else if(k==='rappel'){ addTask('appel',tp.id,'Rappeler '+(mainContact(tp)?.n||tp.nom),15); addHist(tp,'Appel : à rappeler dans 15 jours'+(cr?' · '+cr:'')); toast('Rappel planifié dans 15 jours.'); }
      else if(k==='messagerie'){ addTask('appel',tp.id,'Nouvel essai : '+(mainContact(tp)?.n||tp.nom),1); addHist(tp,'Appel : messagerie'); toast('Nouvel essai demain.'); }
      else { tp.statut='Pas maintenant'; addHist(tp,'Appel : pas intéressé, reprise à 11 mois'+(cr?' · '+cr:'')); toast('Reprise planifiée dans 11 mois.'); }
      save(); render(); break; }
    case 'rep': ui.rep=+id; render(); break;
    case 'ract': { const r=S.replies.find(x=>x.id===+id), rp=byId(r.pid);
      if(k==='rdv'){ rp.statut='A répondu'; addHist(rp,'Réponse positive : 3 créneaux proposés (jeudi 14 h, 15 h 30, vendredi 10 h)'); toast('Brouillon de réponse avec 3 créneaux créé. Statut : A répondu.'); }
      if(k==='tcall'){ addTask('appel',rp.id,`Appeler ${r.de} (demande de rappel)`,2); toast('Tâche d\'appel créée pour jeudi.'); }
      if(k==='nc'){ rp.contacts.push(C(r.nc.n,r.nc.f,'decideur',r.nc.email,'verifie')); addHist(rp,`Nouveau contact ${r.nc.n} (recommandé par ${r.de}), inscrit en séquence`); toast(`${r.nc.n} ajouté et inscrit, avec mention de la recommandation.`); }
      if(k==='reprise'){ rp.statut='Pas maintenant'; addTask('appel',rp.id,`Reprendre contact avec ${r.de} (plan de formation)`,104); addHist(rp,'Pas maintenant : reprise le 02/03/2027'); toast('Reprise planifiée le 02/03/2027.'); }
      if(k==='pause'){ addHist(rp,'Séquence en pause jusqu\'au 26/11/2026'); toast('Séquence en pause jusqu\'au 26/11.'); }

      r.done=true; save(); render(); break; }
    case 'sugg': $('#chatin').value=k; $('#chatform').requestSubmit(); break;
    case 'confirm': { const pd=ui.pending; let n=0; pd.ids.forEach(i=>{ if(inscrire(byId(i),pd.seq)) n++; }); S.chat.push({r:'a',t:`Fait : ${n} prospect${n>1?'s':''} inscrit${n>1?'s':''} dans « ${S.sequences.find(s=>s.id===pd.seq).nom} ». ${pd.ids.length-n?`${pd.ids.length-n} ignoré(s) : sans contact ou opposé.`:''}`}); ui.pending=null; save(); render(); break; }

    case 'sample': loadCSV(SAMPLE,'exemple.csv'); toast('Fichier d\'exemple chargé : 8 lignes.'); break;

    case 'export': toast('Dans l\'outil réel : export JSON et PDF de toutes les données de la personne.'); break;
    case 'bulkseq': { const sid=$('#bulk-seq').value; let n=0; ui.sel.forEach(i=>{ if(inscrire(byId(i),sid)) n++; }); ui.sel.clear(); save(); render(); toast(`${n} prospect${n>1?'s':''} inscrit${n>1?'s':''}.`); break; }
    case 'bulkcrm': ui.sel.forEach(i=>{ const pp=byId(i); pp.statut='Transmis au CRM'; crmLog('prospect.qualifie',pp.nom); }); toast(`${ui.sel.size} prospect(s) envoyé(s) au CRM.`); ui.sel.clear(); save(); render(); break;
    case 'bulkclear': ui.sel.clear(); render(); break;
    case 'pal': openPal(); break;
    case 'delai': S.aiCols=S.aiCols.filter(x=>x!==k); save(); render(); break;
    case 'slots': { const t=$('#g-out'); const ins="\n\nJe vous propose trois créneaux de 20 minutes (Teams ou téléphone) :\n· jeudi 26/11 à 10 h\n· vendredi 27/11 à 14 h 30\n· lundi 30/11 à 11 h\nOu choisissez directement le vôtre : [lien de prise de rendez-vous]"; const v=t.value; const pos=v.indexOf('\n\nBien cordialement'); t.value= pos>0? v.slice(0,pos)+ins+v.slice(pos) : v+ins; ui.gen.texte=t.value; majQualite(); toast('Créneaux libres de votre agenda Microsoft 365 insérés.'); break; }
    case 'theme': toggleTheme(); break;
    case 'pview': ui.pview=k; render(); break;
    case 'sv': { ui.sv=k; const f={q:'',tier:'',seg:'',dep:'',statut:'',sig:false,nc:false}; if(k==='mesA') f.tier='A'; if(k==='signaux') f.sig=true; if(k==='sanscontact') f.nc=true; if(k==='public') f.seg='collectivite'; if(k==='clients') f.statut='Client'; ui.filt=f; render(); break; }
    case 'fnav': { const ids=filtered().map(x=>x.p.id), i=ids.indexOf(ui.pid), n=ids[i+ +k]; if(n){ ui.cidx=0; ui.consigne=''; go('fiche',n); } break; }
    case 'gorep': ui.rep=+id; go('reponses'); break;
    case 'nbasnooze': S.nbaDone.push(k); save(); render(); toast('Reporté à demain.'); break;
    case 'nbadone': { S.nbaDone.push(k); const t=S.tasks.find(x=>x.id===+id); if(t) t.fait=true; S.doneToday++; save(); render(); toast('Bien joué. Action suivante en tête de liste.'); break; }
    case 'lvl': S.niveaux[k]=el.dataset.v; S.journal.unshift({h:new Date().toTimeString().slice(0,5),ic:'bot',txt:`Réglage modifié : « ${NIVEAUX.find(n=>n[0]===k)[1]} » → ${({manuel:'je le fais',proposer:"l'agent propose",auto:'automatique'})[el.dataset.v]}.`}); save(); render(); toast('Niveau enregistré.'); break;
    case 'prepcamp': { const c=S.campagnes.find(x=>x.id===+id); c.etat='Brouillon'; save(); render(); toast(c.cible?`Brouillon prêt : objet, e-mail, post LinkedIn et liste de ${c.cible} destinataires.`:'Brouillon prêt : textes et page à relire.'); break; }
    case 'valcamp': { const c=S.campagnes.find(x=>x.id===+id); c.etat='Prête'; save(); render(); toast('Campagne validée.'); break; }
    case 'sendcamp': { const c=S.campagnes.find(x=>x.id===+id); c.etat='Envoyée'; save(); render(); toast(S.mailTest?'Campagne programmée (mode test : envois redirigés).':'Campagne programmée en début de mois, plafonds respectés.'); break; }
    case 'copypost': { const t=POSTS[+el.dataset.i]; (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Post copié.')).catch(()=>toast('Copie refusée par le navigateur : sélectionnez le texte.')); break; }
    case 'crmmode': S.crmMode=k; save(); render(); toast(k==='autonome'?'Mode autonome : tables locales du module.':'Mode CRM interne : clients et historique lus par l\'API du CRM.'); break;
    case 'relance': case 'relances': { const list=a==='relance'?[S.historique.find(h=>h.id===+id)]:S.historique.filter(h=>echeance(h).etat!=='ok'&&!h.relance); list.forEach(h=>{ h.relance=true; addTask('appel',h.pid||0,`Relance ${h.prest} : ${h.nom} (${h.n} stagiaire${h.n>1?'s':''}, échéance ${fmt(echeance(h).d)})`,0); }); save(); render(); if(ui.view==='journee'){S.doneToday++; save(); render();} toast(`${list.length} relance${list.length>1?'s':''} créée${list.length>1?'s':''} dans les tâches.`); break; }
    case 'addhist': { const nom=$('#h-nom').value.trim(); if(!nom){toast('Indiquez le compte.');break;} const pp=S.prospects.find(x=>x.nom.toLowerCase()===nom.toLowerCase()); S.historique.push({id:++S.nextId,nom,pid:pp?pp.id:0,prest:$('#h-prest').value,date:$('#h-date').value||'2026-11-10',n:+$('#h-n').value||1,formateur:'—',src:'Saisie'}); save(); render(); toast('Session enregistrée, échéance calculée.'); break; }
    case 'flush': { let n=0; S.file.forEach(m=>{ if(m.st==='Programmé'){ m.st=S.mailTest?'Envoyé (redirigé test)':'Envoyé'; n++; const pp=byId(m.pid); if(pp) addHist(pp,`E-mail envoyé${S.mailTest?' (mode test, redirigé)':''} : ${m.obj}`); } }); S.boites[0].auj+=n; save(); render(); toast(`${n} message${n>1?'s':''} ${S.mailTest?'redirigé'+(n>1?'s':'')+' vers l\'adresse de test':'envoyé'+(n>1?'s':'')}.`); break; }
    case 'cancelmail': { const m=S.file.find(x=>x.id===+id); m.st='Annulé'; save(); render(); toast('Envoi annulé.'); break; }
  }
});
document.addEventListener('change',e=>{
  const el=e.target, a=el.dataset.act, p=byId(ui.pid);
  if(el.dataset.filt){ const k=el.dataset.filt; ui.filt[k]= el.type==='checkbox'?el.checked:el.value; if(k!=='q') render(); return; }
  if(el.dataset.w){ const k=el.dataset.w; S.weights[k]= k==='prio'?el.value:+el.value; save(); render(); return; }
  if(el.dataset.lim){ S.limites[el.dataset.lim]=+el.value; save(); render(); return; }
  switch(a){
    case 'sel': { const id=+el.dataset.id; el.checked?ui.sel.add(id):ui.sel.delete(id); render(); break; }
    case 'selall': filtered().forEach(({p})=> el.checked?ui.sel.add(p.id):ui.sel.delete(p.id)); render(); break;
    case 'statut': p.statut=el.value; addHist(p,'Statut → '+el.value); if(el.value==='RDV fixé') crmLog('rdv.fixe',p.nom+' → opportunité créée'); save(); render(); toast('Statut mis à jour.'+(el.value==='RDV fixé'?' Opportunité créée dans le CRM.':'')); break;
    case 'gc': ui.cidx=+el.value; ui.gen=null; render(); break;
    case 'gton': ui.ton=el.value; ui.gen=null; render(); break;
    case 'tdone': { const t=S.tasks.find(x=>x.id===+el.dataset.id); t.fait=el.checked; save(); render(); break; }
    case 'toggle': { const au=S.autos.find(x=>x.id===+el.dataset.id); au.on=el.checked; save(); nav(); toast(au.on?'Automatisation activée.':'Automatisation désactivée.'); break; }
    case 'map': ui.imp.map[+el.dataset.i]=el.value; analyse(); render(); break;
    case 'seqmode': S.sequences.find(s=>s.id===ui.seq).mode=el.value; save(); toast('Mode de validation enregistré.'); break;
    case 'seqcap': S.sequences.find(s=>s.id===ui.seq).plafond=+el.value; save(); break;
    case 'addai': if(el.value){ S.aiCols.push(el.value); save(); render(); toast("Colonne ajoutée : l'IA la remplit pour chaque ligne, avec sa source."); } break;
    case 'mailtest': S.mailTest=el.checked; save(); render(); toast(S.mailTest?'Mode test activé : aucun envoi réel.':'Mode test désactivé : les envois partiront réellement.'); break;
    case 'reclass': { const r=S.replies.find(x=>x.id===+el.dataset.id); if(el.value){ r.cl=el.value; r.conf=100; save(); render(); toast('Classement corrigé : la correction sert au jeu de test du classement.'); } break; }
  }
  if(el.id==='file' && el.files[0]){ const f=el.files[0]; const rd=new FileReader(); rd.onload=()=>loadCSV(String(rd.result),f.name); rd.readAsText(f); }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.filt==='q'){ ui.filt.q=el.value; const pos=el.selectionStart; render(); const n=$('#f-q'); n.focus(); n.setSelectionRange(pos,pos); }
  if(el.dataset.w && el.type==='range'){ const o=$('#wv-'+el.dataset.w); if(o) o.textContent=el.value; }
  if(el.id==='g-out'){ if(ui.gen) ui.gen.texte=el.value; majQualite(); }
  if(el.id==='pal-in'){ ui.pal.q=el.value; ui.pal.i=0; renderPal(); }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='chatform') return; e.preventDefault();
  const v=$('#chatin').value.trim(); if(!v) return;
  S.chat.push({r:'u',t:v}); const r=answer(v); S.chat.push({r:'a',t:r.t,h:r.h});
  ui.pending = r.ids&&r.ids.length&&r.seq ? {ids:r.ids,seq:r.seq,label:`Inscrire ${r.ids.length} prospect${r.ids.length>1?'s':''} dans « ${S.sequences.find(s=>s.id===r.seq).nom} » ?`} : null;
  save(); render(); setTimeout(()=>$('#chatin')?.focus(),0);
});
document.addEventListener('dragover',e=>{ const d=e.target.closest('#drop'); if(d){e.preventDefault(); d.classList.add('over');} });
document.addEventListener('dragleave',e=>{ const d=e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop',e=>{ const d=e.target.closest('#drop'); if(!d) return; e.preventDefault(); const f=e.dataTransfer.files[0]; if(f){ const rd=new FileReader(); rd.onload=()=>loadCSV(String(rd.result),f.name); rd.readAsText(f);} });

document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); ui.pal?closePal():openPal(); return; }
  if(ui.pal){ const n=palItems().length;
    if(e.key==='Escape'){ closePal(); } else if(e.key==='ArrowDown'){ e.preventDefault(); ui.pal.i=(ui.pal.i+1)%Math.max(1,n); renderPal(); } else if(e.key==='ArrowUp'){ e.preventDefault(); ui.pal.i=(ui.pal.i-1+n)%Math.max(1,n); renderPal(); } else if(e.key==='Enter'){ e.preventDefault(); runPal(ui.pal.i); }
    return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); openPal(); }
  if(ui.view==='fiche'&&(e.key==='j'||e.key==='k')){ const b=document.querySelector(`[data-act=fnav][data-k="${e.key==='j'?1:-1}"]`); if(b&&!b.disabled) b.click(); }
});
document.addEventListener('mousedown',e=>{ if(!ui.pal) return; const li=e.target.closest('[data-pi]'); if(li){ e.preventDefault(); runPal(+li.dataset.pi); return; } if(e.target.dataset.pal==='back') closePal(); });
document.addEventListener('dragstart',e=>{ const c=e.target.closest?.('[data-kid]'); if(!c) return; e.dataTransfer.setData('text/plain',c.dataset.kid); e.dataTransfer.effectAllowed='move'; c.classList.add('drag'); });
document.addEventListener('dragend',e=>{ e.target.classList?.remove('drag'); document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over')); });
document.addEventListener('dragover',e=>{ const c=e.target.closest?.('.kcol'); if(c){ e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(x=>x!==c&&x.classList.remove('over')); c.classList.add('over'); } });
document.addEventListener('drop',e=>{ const c=e.target.closest?.('.kcol'); if(!c) return; e.preventDefault(); const p=byId(e.dataTransfer.getData('text/plain')); if(!p) return; const st=c.dataset.statut; if(p.statut!==st){ if(st==='En séquence'&&!mainContact(p)){ toast('Ajoutez d\'abord un contact.'); render(); return; } p.statut=st; addHist(p,'Statut → '+st+' (glisser-déposer)'); if(st==='RDV fixé') crmLog('rdv.fixe',p.nom+' → opportunité créée'); save(); toast(`${p.nom} → ${st}${st==='RDV fixé'?' · opportunité créée dans le CRM':''}.`); } render(); });
try{ const th=localStorage.getItem('pm-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
ui.view = location.hash.slice(1) || 'journee';
if(ui.view==='fiche' && !byId(ui.pid)) ui.view='prospects';
render();
</script>
